name: Release

# Changesets release flow with npm trusted publishing (OIDC).
# - Push to main with pending changesets: opens or updates a "version packages" PR.
# - Merge that PR: publishes the new version to npm with provenance.
# No npm token is stored in the repository. Configure a trusted publisher for
# this package on npmjs.com (repository + workflow file "release.yml").

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      # The template itself ships a placeholder package name that can't be
      # published. Skip the release step until the package is renamed.
      - name: Check for template placeholder
        id: package
        run: |
          name="$(node -p "require('./package.json').name")"
          if [ "$name" = "@your-scope/your-package" ]; then
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Package name is still the template placeholder, skipping release."
          else
            echo "placeholder=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish
        if: steps.package.outputs.placeholder != 'true'
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
